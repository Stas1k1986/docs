<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Code Library</title>
<style>
:root{
  --bg:#0b0f14;--panel:#0f1520;--panel2:#0c111a;--text:#e6edf3;--muted:#94a3b8;--accent:#22c55e;
  --border:rgba(148,163,184,.18);--shadow:0 10px 30px rgba(0,0,0,.35);
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,"Helvetica Neue",Arial,"Noto Sans","Apple Color Emoji","Segoe UI Emoji";
}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;font-family:var(--sans);background:linear-gradient(180deg,#0b0f14 0%,#070a0f 100%);color:var(--text)}
.topbar{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;
  padding:12px 16px;background:rgba(11,15,20,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.brand{font-weight:900;letter-spacing:.2px}
.themeBar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.themeBtn{padding:10px 12px;border-radius:999px;border:1px solid rgba(148,163,184,.28);background:rgba(15,21,32,.6);
  color:var(--text);cursor:pointer;font-weight:800}
.themeBtn:hover{border-color:rgba(34,197,94,.45)}
.themeBtn.active{border-color:rgba(34,197,94,.65);background:rgba(34,197,94,.14)}
.actions{display:flex;gap:10px;align-items:center;justify-content:flex-end}
#search{width:min(520px,38vw);padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--panel2);color:var(--text);outline:none}
#search:focus{border-color:rgba(34,197,94,.6)}
.btn{padding:10px 12px;border-radius:12px;border:1px solid rgba(34,197,94,.35);background:rgba(34,197,94,.12);color:var(--text);cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.wrap{padding:18px;max-width:1200px;margin:0 auto}
.note{color:var(--muted);font-size:12px;margin-bottom:12px}
.browser{display:grid;grid-template-columns:420px 1fr;gap:14px;align-items:start}
.sidebar{border:1px solid var(--border);background:rgba(15,21,32,.7);border-radius:18px;box-shadow:var(--shadow);padding:12px}
.sectionTitle{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:10px 6px 10px}
.folders,.files{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border-radius:14px;background:rgba(12,17,26,.35);
  border:1px solid transparent;cursor:pointer}
.item:hover{border-color:rgba(148,163,184,.25)}
.item.active{border-color:rgba(34,197,94,.55);background:rgba(34,197,94,.12)}
.item .left{display:flex;flex-direction:column;gap:2px;min-width:0}
.item .name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:11px;color:rgba(230,237,243,.9);border:1px solid rgba(148,163,184,.25);border-radius:999px;padding:4px 8px;flex:0 0 auto}
.viewer{border:1px solid var(--border);background:rgba(15,21,32,.7);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;min-height:560px;display:flex;flex-direction:column}
.crumbs{color:var(--muted);font-size:12px;padding:10px 14px 0}
.viewerHeader{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border)}
.fileTitle{font-weight:900;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{color:var(--muted);font-size:12px;white-space:nowrap}
.code{margin:0;padding:14px;overflow:auto;font-family:var(--mono);font-size:13px;line-height:1.55}
.footer{padding:10px 16px 18px;color:var(--muted);font-size:12px;max-width:1200px;margin:0 auto}
@media (max-width:980px){
  .topbar{grid-template-columns:1fr;gap:10px}
  .actions{justify-content:flex-start}
  #search{width:88vw}
  .browser{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">🧩 Code Library</div>
  <div class="themeBar" id="themeBar"></div>
  <div class="actions">
    <input id="search" type="search" placeholder="Пошук по файлах…" autocomplete="off"/>
    <button id="copyBtn" class="btn" disabled>Скопіювати</button>
  </div>
</header>

<main class="wrap">
  <div class="note">Обери тему кнопками зверху, далі — папку/файл зліва, код — справа. (Це один HTML, працює навіть з file://)</div>
  <section class="browser">
    <aside class="sidebar">
      <div class="sectionTitle">Папки</div>
      <div class="folders" id="folders"></div>
      <div class="sectionTitle">Файли</div>
      <div class="files" id="files"></div>
    </aside>
    <section class="viewer">
      <div class="crumbs" id="crumbs">—</div>
      <div class="viewerHeader">
        <div class="fileTitle" id="fileTitle">—</div>
        <div class="meta" id="meta"></div>
      </div>
      <pre id="code" class="code"><code>// Обери тему зверху…</code></pre>
    </section>
  </section>
</main>

<footer class="footer"><span id="status"></span></footer>

<script>
const $ = (id) => document.getElementById(id);
const THEMES = ["Chocolate","Payment","Push Notification","Calculate"];
let manifest, codeMap;
let currentTheme=null, currentFolder="__ALL__", currentFile=null, currentText="";

function fmtBytes(n){ if(n===0) return "0 B"; const k=1024,s=["B","KB","MB","GB"]; const i=Math.floor(Math.log(n)/Math.log(k)); return (n/Math.pow(k,i)).toFixed(i===0?0:1)+" "+s[i]; }
function setStatus(m){ $("status").textContent = m||""; }

function renderThemeButtons(){
  const bar = $("themeBar"); bar.innerHTML="";
  THEMES.forEach(t=>{
    const b=document.createElement("button");
    b.className="themeBtn"+(currentTheme===t?" active":"");
    b.textContent=t;
    b.onclick=()=>selectTheme(t);
    bar.appendChild(b);
  });
}

function selectTheme(theme){
  currentTheme=theme; currentFolder="__ALL__"; currentFile=null; currentText="";
  $("code").textContent="// Обери файл…"; $("fileTitle").textContent="—"; $("meta").textContent=""; $("copyBtn").disabled=true; $("search").value="";
  renderThemeButtons(); renderFolders(); renderFiles(); updateCrumbs(); setStatus("Тема: "+theme);
}

function folderButton(label,key,sub){
  const div=document.createElement("div");
  div.className="item"+(currentFolder===key?" active":""); div.tabIndex=0;
  div.onclick=()=>{ currentFolder=key; currentFile=null; currentText=""; $("copyBtn").disabled=true; $("code").textContent="// Обери файл…"; renderFolders(); renderFiles(); updateCrumbs(); };
  div.onkeydown=(e)=>{ if(e.key==="Enter") div.click(); };
  const left=document.createElement("div"); left.className="left";
  const name=document.createElement("div"); name.className="name"; name.textContent=label;
  const s=document.createElement("div"); s.className="sub"; s.textContent=sub||"";
  left.appendChild(name); left.appendChild(s);
  const badge=document.createElement("div"); badge.className="badge"; badge.textContent=(key==="__ALL__"?"ALL":"DIR");
  div.appendChild(left); div.appendChild(badge);
  return div;
}

function renderFolders(){
  const wrap=$("folders"); wrap.innerHTML="";
  if(!currentTheme){ wrap.appendChild(folderButton("—","__ALL__","Спочатку обери тему")); return; }
  const info=manifest.themes[currentTheme]; const folders=info.folders||[];
  wrap.appendChild(folderButton("Всі файли","__ALL__", folders.length?"Показати все":"—"));
  folders.forEach(f=>wrap.appendChild(folderButton(f,f,"Папка")));
}

function renderFiles(){
  const wrap=$("files"); wrap.innerHTML="";
  if(!currentTheme){
    const empty=document.createElement("div"); empty.className="item"; empty.style.cursor="default";
    empty.innerHTML=`<div class="left"><div class="name">Оберіть тему</div><div class="sub">Кнопки зверху</div></div>`;
    wrap.appendChild(empty); return;
  }
  const info=manifest.themes[currentTheme];
  const q=($("search").value||"").trim().toLowerCase();
  let files=info.files||[];
  if(currentFolder!=="__ALL__") files=files.filter(f=>f.subfolder===currentFolder);
  if(q) files=files.filter(f=>(f.name||"").toLowerCase().includes(q)||(f.rel||"").toLowerCase().includes(q));

  if(!files.length){
    const empty=document.createElement("div"); empty.className="item"; empty.style.cursor="default";
    empty.innerHTML=`<div class="left"><div class="name">Нічого не знайдено</div><div class="sub">Спробуй інший запит або іншу папку</div></div>`;
    wrap.appendChild(empty); return;
  }

  files.forEach(f=>{
    const div=document.createElement("div");
    div.className="item"+(currentFile?.path===f.path?" active":""); div.tabIndex=0;
    div.onclick=()=>selectFile(f);
    div.onkeydown=(e)=>{ if(e.key==="Enter") selectFile(f); };
    const left=document.createElement("div"); left.className="left";
    const name=document.createElement("div"); name.className="name"; name.textContent=f.name;
    const sub=document.createElement("div"); sub.className="sub"; sub.textContent=f.rel;
    left.appendChild(name); left.appendChild(sub);
    const badge=document.createElement("div"); badge.className="badge"; badge.textContent=f.ext||"file";
    div.appendChild(left); div.appendChild(badge);
    wrap.appendChild(div);
  });
}

function selectFile(f){
  currentFile=f; updateCrumbs(); renderFiles();
  $("fileTitle").textContent=f.rel;
  const text = codeMap[f.path] ?? "// (нема даних)";
  currentText=text;
  $("code").textContent=text;
  $("meta").textContent=`${fmtBytes(f.size)} • ${f.ext||"file"}`;
  $("copyBtn").disabled = !text;
  setStatus("Готово ✅");
}

function updateCrumbs(){
  if(!currentTheme){ $("crumbs").textContent="—"; return; }
  const folderLabel = currentFolder==="__ALL__" ? "Всі файли" : currentFolder;
  const fileLabel = currentFile ? currentFile.name : "—";
  $("crumbs").textContent = `${currentTheme} → ${folderLabel} → ${fileLabel}`;
}

(function init(){
  const payload = JSON.parse($("DATA").textContent);
  manifest = payload.manifest;
  codeMap = payload.codeMap;

  renderThemeButtons(); renderFolders(); renderFiles(); updateCrumbs();
  setStatus("Готово ✅ (обери тему)");

  $("search").addEventListener("input", ()=>renderFiles());
  $("copyBtn").addEventListener("click", async ()=>{
    if(!currentText) return;
    try{ await navigator.clipboard.writeText(currentText); setStatus("Скопійовано ✅"); }
    catch{
      const ta=document.createElement("textarea"); ta.value=currentText; document.body.appendChild(ta);
      ta.select(); document.execCommand("copy"); document.body.removeChild(ta); setStatus("Скопійовано ✅");
    }
  });
})();
</script>
</body>
</html>
