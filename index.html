<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>OOP Library</title>
<style>
:root{--bg:#0b0f14;--panel:#0f1520;--panel2:#0c111a;--text:#e6edf3;--muted:#94a3b8;--accent:#22c55e;--border:rgba(148,163,184,.18);--shadow:0 10px 30px rgba(0,0,0,.35);--mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;--sans:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,"Helvetica Neue",Arial,"Noto Sans","Apple Color Emoji","Segoe UI Emoji";}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;font-family:var(--sans);background:linear-gradient(180deg,#0b0f14 0%,#070a0f 100%);color:var(--text)}
.topbar{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:12px 16px;background:rgba(11,15,20,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.brand{font-weight:900;letter-spacing:.2px}
.sectionBar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sectionBtn{padding:10px 12px;border-radius:999px;border:1px solid rgba(148,163,184,.28);background:rgba(15,21,32,.6);color:var(--text);cursor:pointer;font-weight:800}
.sectionBtn:hover{border-color:rgba(34,197,94,.45)}
.sectionBtn.active{border-color:rgba(34,197,94,.65);background:rgba(34,197,94,.14)}
.actions{display:flex;gap:10px;align-items:center;justify-content:flex-end}
#search{width:min(520px,38vw);padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--panel2);color:var(--text);outline:none}
#search:focus{border-color:rgba(34,197,94,.6)}
.btn{padding:10px 12px;border-radius:12px;border:1px solid rgba(34,197,94,.35);background:rgba(34,197,94,.12);color:var(--text);cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.wrap{padding:18px;max-width:1200px;margin:0 auto}
.note{color:var(--muted);font-size:12px;margin-bottom:12px}
.browser{display:grid;grid-template-columns:420px 1fr;gap:14px;align-items:start}
.sidebar{border:1px solid var(--border);background:rgba(15,21,32,.7);border-radius:18px;box-shadow:var(--shadow);padding:12px}
.sectionTitle{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:10px 6px 10px}
.folders,.files{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border-radius:14px;background:rgba(12,17,26,.35);border:1px solid transparent;cursor:pointer}
.item:hover{border-color:rgba(148,163,184,.25)}
.item.active{border-color:rgba(34,197,94,.55);background:rgba(34,197,94,.12)}
.item .left{display:flex;flex-direction:column;gap:2px;min-width:0}
.item .name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:11px;color:rgba(230,237,243,.9);border:1px solid rgba(148,163,184,.25);border-radius:999px;padding:4px 8px;flex:0 0 auto}
.viewer{border:1px solid var(--border);background:rgba(15,21,32,.7);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;min-height:560px;display:flex;flex-direction:column}
.crumbs{color:var(--muted);font-size:12px;padding:10px 14px 0}
.viewerHeader{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border)}
.fileTitle{font-weight:900;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{color:var(--muted);font-size:12px;white-space:nowrap}
.code{margin:0;padding:14px;overflow:auto;font-family:var(--mono);font-size:13px;line-height:1.55;white-space:pre}
.footer{padding:10px 16px 18px;color:var(--muted);font-size:12px;max-width:1200px;margin:0 auto}
@media (max-width:980px){.topbar{grid-template-columns:1fr;gap:10px}.actions{justify-content:flex-start}#search{width:88vw}.browser{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">📚 OOP Library</div>
  <div class="sectionBar" id="sectionBar"></div>
  <div class="actions">
    <input id="search" type="search" placeholder="Пошук по файлах…" autocomplete="off"/>
    <button id="copyBtn" class="btn" disabled>Скопіювати</button>
  </div>
</header>

<main class="wrap">
  <div class="note">З теоретичної частини прибрані всі зображення (png/jpg/...).</div>
  <section class="browser">
    <aside class="sidebar">
      <div class="sectionTitle">Папки</div>
      <div class="folders" id="folders"></div>
      <div class="sectionTitle">Файли</div>
      <div class="files" id="files"></div>
    </aside>

    <section class="viewer">
      <div class="crumbs" id="crumbs">—</div>
      <div class="viewerHeader">
        <div class="fileTitle" id="fileTitle">—</div>
        <div class="meta" id="meta"></div>
      </div>
      <pre id="code" class="code">// Обери розділ зверху…</pre>
    </section>
  </section>
</main>

<footer class="footer"><span id="status"></span></footer>

scription;\n    }\n    @Override\n    public double getPrice() {\n        return price;\n    }\n    @Override\n    public void accept(Visitor visitor){\n        visitor.visit(this);\n    }\n}\n", "Basket/CalculateTotal.java": "public class CalculateTotal implements Visitor {\n    private double total = 0.0;\n\n    @Override\n    public void visit(Article article){\n        total += article.getPrice();\n    }\n    @Override\n    public void visit(Voucher voucher){\n        total -= voucher.getPrice();\n    }\n    public double getTotal(){\n        return total;\n    }\n}\n", "Basket/PrintReceipt.java": "public class PrintReceipt implements Visitor {\n\n    @Override\n    public void visit(Article article){\n        System.out.println(article.getDescription());\n    }\n    @Override\n    public void visit(Voucher voucher){\n        System.out.println(voucher.getDescription());\n    }\n}\n", "Basket/Main.java": "import javax.lang.model.util.Elements;\n\n//TIP To <b>Run</b> code, press <shortcut actionId=\"Run\"/> or\n// click the <icon src=\"AllIcons.Actions.Execute\"/> icon in the gutter.\npublic class Main {\n    public static void main(String[] args) {\n        Basket basket = new Basket();\n        basket.buyArticle(new Article(\"Sigma\", 1500.0));\n        basket.buyArticle(new Article(\"Lambda\", 1200.0));\n        basket.applyVoucher(new Voucher(\"Winter\", 500.0));\n\n        CalculateTotal calculateTotal = new CalculateTotal();\n            for (Element element : basket.getElements()) {\n                element.accept(calculateTotal);\n            }\n\n        PrintReceipt receipt = new PrintReceipt();\n            for (Element element : basket.getElements()) {\n                element.accept(receipt);\n            }\n            System.out.println(calculateTotal.getTotal());\n    }\n\n}", "Basket/Voucher.java": "public class Voucher implements Element {\n  private String description;\n  private double price;\n\n\n  public Voucher(String description, double price) {\n      this.description = description;\n      this.price = price;\n  }\n  public String getDescription(){\n      return description;\n  }\n  public double getPrice(){\n      return price;\n  }\n  public void accept(Visitor visitor){\n      visitor.visit(this);\n  }\n}\n", "ChocolateFabric/Chocolate.java": "class Chocolate {\n    private String base;\n    private String filling;\n    private String sprinkle;\n\n    public Chocolate(String base, String filling, String sprinkle) {\n        this.base = base;\n        this.filling = filling;\n        this.sprinkle = sprinkle;\n    }\n\n    public String getBase() {\n        return base;\n    }\n\n    public String getFilling() {\n        return filling;\n    }\n\n    public String getSprinkle() {\n        return sprinkle;\n    }\n}\n", "ChocolateFabric/Builder.java": "interface Builder {\n    void buildBase();\n    void buildFilling();\n    void buildSprinkle();\n    Chocolate getChocolate();\n}\n\n", "ChocolateFabric/VanillaDream.java": "public class VanillaDream implements Builder {\n    private Chocolate chocolate;\n    private String base;\n    private String filling;\n    private String sprinkle;\n\n    @Override\n    public void buildBase(){\n        this.base = \"cocoa butter with cream\";\n    }\n    @Override\n    public void buildFilling(){\n        this.filling = \"vanilla pod\";\n    }\n    @Override\n    public void buildSprinkle(){\n        this.sprinkle = \"almond flakes\";\n    }\n    public Chocolate getChocolate() {\n        if (chocolate == null) {\n            chocolate = new Chocolate(base, filling, sprinkle);\n        }\n        return chocolate;\n    }\n}\n", "ChocolateFabric/Director.java": "interface Director {\n    Chocolate construct(Builder builder);\n}\n\n", "ChocolateFabric/CherrySecret.java": "import java.awt.*;\n\nclass CherrySecret implements Builder {\n    private Chocolate chocolate;\n    private String base;\n    private String filling;\n    private String sprinkle;\n\n    @Override\n    public void buildBase() {\n        this.base = \"cocoa mass with 80 % of cocoa\";\n    }\n\n    @Override\n    public void buildFilling() {\n        this.filling = \"cherry puree\";\n    }\n\n    @Override\n    public void buildSprinkle() {\n        this.sprinkle = \"chilli pepper flakes\";\n    }\n\n    @Override\n    public Chocolate getChocolate() {\n        return new Chocolate(base, filling, sprinkle);\n    }\n}\n", "ChocolateFabric/Main.java": "//TIP To <b>Run</b> code, press <shortcut actionId=\"Run\"/> or\n// click the <icon src=\"AllIcons.Actions.Execute\"/> icon in the gutter.\npublic class Main {\n    public static void main(String[] args) {\n        // Create director\n        Director director = new NewTastesCenter();\n\n        // Create builders\n        Builder vanillaDreamBuilder = new VanillaDream();\n        Builder cherrySecretBuilder = new CherrySecret();\n\n        // Create chocolates\n        Chocolate vanillaDream = director.construct(vanillaDreamBuilder);\n        Chocolate cherrySecret = director.construct(cherrySecretBuilder);\n\n        // Print results\n        System.out.println(\"Vanilla Dream - Base: \" + vanillaDream.getBase() +\n                \", Filling: \" + vanillaDream.getFilling() +\n                \", Sprinkle: \" + vanillaDream.getSprinkle());\n\n        System.out.println(\"Cherry Secret - Base: \" + cherrySecret.getBase() +\n                \", Filling: \" + cherrySecret.getFilling() +\n                \", Sprinkle: \" + cherrySecret.getSprinkle());\n    }\n}", "ChocolateFabric/text.txt": "V Charlieho továrni na čokoládu je riadiace centrum nových chutí (`NewTastesCenter`) zodpovedné za výrobu exkluzívnych čokolád s rôznymi náplňami a príchuťami (`Chocolate`). Každú tabuľku čokolády (`Chocolate`) tvorí niekoľko základných prvkov:\n\n- základná čokoládová hmota (`base`),\n- náplň (`filling`), a\n- posýpka (`sprinkle`).\n  Na reprezentáciu jednotlivých prvkov objektu čokolády použite textové reťazce. Charlieho továreň na čokoládu využíva na vytvorenie čokolád skladacie triedy, ktoré implementujú rozhranie Builder deklarujúce operácie na vyskladanie čokolády z jednotlivých častí. Skladacie triedy si uchovávajú informáciu o každej vytvorenej časti a objekt čokolády je vytvorený z týchto častí, až keď sú všetky z nich vytvorené skladacou triedou príslušnými operáciami.\n  Čokoládu „Vanilla Dream“ (`VanillaDream`) tvorí:\n- základná čokoládová hmota reprezentovaná reťazcom „cocoa butter with cream“,\n- náplň reťazcom „vanilla pod“,\n- posýpka „almond flakes“.\n  Čokoláda „Cherry Secret“ (`CherrySecret`) nech má\n- základnú čokoládovú hmotu reprezentovanú reťazcom „cocoa mass with 80 % of cocoa“,\n- náplň reťazcom „cherry puree“,\n- posýpku reťazcom „chilli pepper flakes“.\n  Riadiace centrum nových chutí Charlieho továrne (`NewTastesCenter`) implementuje rozhranie Director deklarujúce operáciu na zostavenie čokolády pomocou objektu typu Builder.\n  V priloženom Main súbore vytvorte metódu main() (vstupný bod programu), v ktorej použijete vašu implementáciu nasledovne:\n  Vytvorte dve čokolády pomocou skladacích tried VanillaDream a CherrySecret s využitím NewTastesCenter.", "ChocolateFabric/NewTastesCenter.java": "class NewTastesCenter implements Director {\n    @Override\n    public Chocolate construct(Builder builder) {\n        builder.buildBase();\n        builder.buildFilling();\n        builder.buildSprinkle();\n        return builder.getChocolate();\n    }\n}\n", "Mircoscope/Star.java": "public class Star {\n    public String light() {\n        return \"svetlo hviezdy ranneho spektralneho typu A\";\n    }\n}\n", "Mircoscope/Fridge.java": "public class Fridge implements Target {\n    public String content;\n\n    public String content(){\n       return(\"rybacia konzerva, zoschnuty syr, flasa piva\");\n    }\n    @Override\n    public void scan(){\n        System.out.println(content);\n    }\n}\n", "Mircoscope/Main.java": "//TIP To <b>Run</b> code, press <shortcut actionId=\"Run\"/> or\n// click the <icon src=\"AllIcons.Actions.Execute\"/> icon in the gutter.\npublic class Main {\n    public static void main(String[] args) {\n        Target fridge = new Fridge();\n        fridge.scan();\n\n        Star star = new Star();\n        Target telescope = new Telescope(star);\n        telescope.scan();\n\n        Preparation preparation = new Preparation();\n        Target microscope = new Microscope(preparation);\n        microscope.scan();\n    }\n}", "Mircoscope/text.txt": "Program (Main) dokáže preskúmavať predmety (Target) metódou scan(). Sú predmety, ktoré sa dajú preskúmať priamo a predmety, ktoré sa dajú preskúmať nepriamo.\n\nChladnička (Fridge) implementuje svoj obsah ako návratovú hodnotu metódy content() reprezentovanú reťazcom „rybacia konzerva, zoschnuty syr, flasa piva“. Chladničku vieme preskúmať priamo (implementuje rozhranie Target). Výsledok skúmania chladničky zavolaním metódy scan() vypíšte na obrazovku.\n\nHviezda (Star) je predmet veľmi vzdialený, ktorý sa nedá preskúmať priamo. Z hviezdy je vidieť iba svetlo implementované ako návratová hodnota metódy light() reprezentovaná reťazcom „svetlo hviezdy ranneho spektralneho typu A“. Pre preskúmanie hviezdy implementujte teleskop (Telescope) ako adaptér implementovaním Target, ktorým sa svetlo hviezdy dá preskúmať. Výsledok skúmania hviezdy teleskopom zavolaním metódy scan() vypíšte na obrazovku.\n\nHistologický preparát (Preparation) je tiež predmet, ktorý sa nedá preskúmať priamo, je vidieť len tkanivo implementované ako návratová hodnota metódy tissue() reprezentovaná reťazcom „bunky pecene poskodene cirhozou“. Pre preskúmanie preparátu implementujte mikroskop (Microscope) ako adaptér implementovaním Target, ktorým sa tkanivo preparátu dá preskúmať. Výsledok skúmania preparátu mikroskopom zavolaním metódy scan() vypíšte na obrazovku.\n\nV priloženom Main súbore vytvorte metódu main() (vstupný bod programu), v ktorej použijete vašu implementáciu nasledovne:\n\nV programe vytvorte objekty všetkých troch predmetov a preskúmajte ich, buď priamo, alebo nepriamo vhodnými adaptérmi.", "Mircoscope/Telescope.java": "public class Telescope implements Target {\n    private Star star;\n\n    public Telescope(Star star) {\n        this.star = star;\n    }\n    @Override\n    public void scan(){\n        System.out.println(star.light());\n    }\n}\n", "Mircoscope/Microscope.java": "public class Microscope implements Target {\n    private Preparation preparation;\n\n    public Microscope(Preparation preparation) {\n        this.preparation = preparation;\n    }\n    @Override\n    public void scan(){\n        System.out.println(preparation.tissue());\n    }\n}\n", "Mircoscope/Target.java": "public interface Target {\n    void scan();\n}\n", "Mircoscope/Preparation.java": "public class Preparation {\n    public String tissue() {\n       return \"bunky pecene poskodene cirhozou\";\n    }\n\n}\n", "PayPal/Cash.java": "public class Cash implements Payment, PaymentStatus {\n    private String status;\n\n    @Override\n    public void pay(double amount) {\n        this.status = \"Cash: \" + amount;\n    }\n\n    @Override\n    public String getPaymentStatus() {\n        return status;\n    }\n}\n", "PayPal/PaymentStatus.java": "public interface PaymentStatus {\n     String getPaymentStatus();\n}\n", "PayPal/PaymentCard.java": "public class PaymentCard {\n    private String cardNumber;\n    private String expiryDate;\n    private String securityCode;\n\n    public PaymentCard(String cardNumber, String expiryDate, String securityCode) {\n        this.cardNumber = cardNumber;\n        this.expiryDate = expiryDate;\n        this.securityCode = securityCode;\n    }\n\n    public String getCardNumber() {\n        return cardNumber;\n    }\n    public String getExpiryDate() {\n        return expiryDate;\n    }\n    public String getSecurityCode() {\n        return securityCode;\n    }\n}\n", "PayPal/Payment.java": "public interface Payment {\n    void pay(double amount);\n}\n", "PayPal/Article.java": "public class Article {\n    private String name;\n    private int quantity;\n    private double price;\n\n    public Article(String name, int quantity, double price) {\n        this.name = name;\n        this.quantity = quantity;\n        this.price = price;\n    }\n\n    public String getName() {\n        return name;\n    }\n    public int getQuantity() {\n        return quantity;\n    }\n    public double getPrice() {\n        return price;\n    }\n}\n", "PayPal/Shop.java": "public interface Shop {\n    void sell(Article article);\n    void pay(Payment payment);\n}\n", "PayPal/PaymentCardService.java": "class PaymentCardService implements PaymentStatus {\n    private String paymentStatus;\n\n    public void payByPaymentCard(PaymentCard paymentCard, double amount) {\n        this.paymentStatus = \"Payment card: \" + paymentCard.getCardNumber() + \", \" +\n                paymentCard.getExpiryDate() + \", \" +\n                paymentCard.getSecurityCode() + \", \" + amount;\n    }\n\n    @Override\n    public String getPaymentStatus() {\n        return paymentStatus;\n    }\n}\n", "PayPal/PaymentCardAdapter.java": "public class PaymentCardAdapter implements Payment, PaymentStatus {\n    private PaymentCardService paymentCardService;\n    private PaymentCard paymentCard;\n\n    public PaymentCardAdapter(PaymentCard paymentCard) {\n        this.paymentCard = paymentCard;\n        this.paymentCardService = new PaymentCardService();\n    }\n\n    @Override\n    public void pay(double amount) {\n        paymentCardService.payByPaymentCard(paymentCard, amount);\n    }\n\n    @Override\n    public String getPaymentStatus() {\n        return paymentCardService.getPaymentStatus();\n    }\n}\n", "PayPal/Grocery.java": "import java.util.ArrayList;\nimport java.util.List;\n\npublic class Grocery implements Shop {\n    private List<Article> articles = new ArrayList<>();\n\n    @Override\n    public void sell(Article article) {\n        articles.add(article);\n    }\n    @Override\n    public void pay(Payment payment) {\n        double total = 0;\n        for (Article article : articles) {\n            total += article.getPrice() * article.getQuantity();\n        }\n    payment.pay(total);\n    }\n}\n", "PayPal/Main.java": "//TIP To <b>Run</b> code, press <shortcut actionId=\"Run\"/> or\n// click the <icon src=\"AllIcons.Actions.Execute\"/> icon in the gutter.\npublic class Main {\n    public static void main(String[] args) {\n        Grocery shop = new Grocery();\n\n        shop.sell(new Article(\"Bread\", 2, 1.50));\n        shop.sell(new Article(\"Milk\", 1, 0.90));\n\n        // Cash payment\n        Cash cash = new Cash();\n        shop.pay(cash);\n        System.out.println(cash.getPaymentStatus());\n\n        // PayPal payment\n        PayPalAdapter paypal = new PayPalAdapter(\"user@example.com\");\n        shop.pay(paypal);\n        System.out.println(paypal.getPaymentStatus());\n\n        // Card payment\n        PaymentCard card = new PaymentCard(\"1234-5678\", \"12/26\", \"999\");\n        PaymentCardAdapter cardAdapter = new PaymentCardAdapter(card);\n        shop.pay(cardAdapter);\n        System.out.println(cardAdapter.getPaymentStatus());\n    }\n}", "PayPal/text.txt": "V obchode (Grocery) môžeme nakupovať (sell()) tovary (Article) a následne môžeme nákup zaplatiť (pay()). Na platenie používame rôzne typy platieb: hotovosť (Cash), službu PayPal (PayPalService) a platobnú kartu (PaymentCardService). Metóda pay() umožňuje platiť iba platbami typu Payment. V našom prípade je to iba trieda Cash, služby PayPalService a PaymentCardService sú nekompatibilné. Implementujte dva adaptéry pre tieto služby (PayPalAdapter a PaymentCardAdapter), aby sme pomocou nich mohli platiť za nákup tovarov v obchode.\nTrieda Cash implementuje rozhranie Payment a jej metóda pay() uloží stav platby ako reťazec vo forme \"Cash: 12.3\", kde údaj 12.3 je zaplatená suma (double) získaná ako vstupný parameter pay(). Trieda Cash zároveň implementuje rozhranie PaymentStatus a jej metóda getPaymentStatus() vráti uložený reťazec stavu platby.\nTrieda PayPalService implementuje metódu payByPayPal(), ktorá uloží stav platby ako reťazec vo forme \"PayPal: paypal_account, 12.3\", kde údaj paypal_account je PayPal konto zákazníka (String) a údaj 12.3 je zaplatená suma (double), obidva údaje sú získané ako vstupné parametre payByPayPal(). Trieda PayPalService zároveň implementuje rozhranie PaymentStatus a jej metóda getPaymentStatus() vráti uložený reťazec stavu platby.\nTrieda PaymentCardService implementuje metódu payByPaymentCard(), ktorá uloží stav platby ako reťazec vo forme napr. \"Payment card: card_number, expiry_date, security_code, 12.3\", kde údaje card_number, expiry_date a security_card reprezentujú kartu zákazníka a údaj 12.3 je zaplatená suma (double). Údaje o karte zákazníka sú zapúzdrené v objekte triedy PaymentCard ako tri samostatné reťazce (String). Objekt PaymentCard a zalatená suma sú získané ako vstupné parametre payByPaymentCard(). Trieda PaymentCardService zároveň implementuje rozhranie PaymentStatus a jej metóda getPaymentStatus() vráti uložený reťazec stavu platby.\nTrieda adaptéra PayPalAdapter implementuje rozhrania Payment a PaymentStatus. Do konštruktora tejto triedy vstupuje reťazec o PayPal konte zákazníka (String). Konštruktor vytvára objekt služby PayPal (PayPalService). PayPal konto zákazníka a objekt služby PayPal sú použité vo funkcii pay() pre realizáciu platby službou PayPal. Metóda getPaymentStatus() vráti stav platby z objektu služby PayPal.\nTrieda adaptéra PaymentCardAdapter implementuje rozhrania Payment a PaymentStatus. Do konštruktora tejto triedy vstupuje objekt karty zákazníka (PaymentCard). Konštruktor vytvára objekt služby pre platbu kartou (PaymentCardService). Objekt karty zákazníka a objekt služby pre platbu kartou sú použité vo funkcii pay() pre realizáciu platby kartou. Metóda getPaymentStatus() vráti stav platby z objektu služby pre platbu kartou.\nObchod (Grocery) implementuje rozhranie Shop. Metóda sell() ukladá nakúpený tovar do košíka ako zoznam objektov (List<Article>) a metóda pay() spočíta celkovú hodnotu nakpúteného tovaru v košíku (suma súčinov množstva a ceny tovarov) a realizuje platbu volaním pay() nad objektom Payment, ktorý vstúpi do metódy ako parameter. Nakupovaný tovar (Article) zapúzdruje údaje o tovare ako sú meno, množstvo a cena (pozri diagram).\nV priloženom Main súbore vytvorte metódu main() (vstupný bod programu), v ktorej použijete vašu implementáciu nasledovne:\nV programe vytvorte objekt obchodu. Volaním jeho metódy sell() nakúpte niekoľko objektov tovarov. Volaním jeho metódy pay() zaplaťte za tovar postupne všetkými troma spôsobmi. Použite na to objekty Cash, PayPalAdapter a PaymentCardAdapter. Na obrazovku vypíšte stavy všetkých troch platieb.\n", "PayPal/PayPalService.java": "public class PayPalService implements PaymentStatus {\n    private String paymentStatus;\n\n    public void payByPayPal(String payPalAccount, double amount) {\n        this.paymentStatus = \"PayPal: \" + payPalAccount + \", \" + amount;\n    }\n\n    @Override\n    public String getPaymentStatus() {\n        return this.paymentStatus;\n    }\n\n}\n", "PayPal/PayPalAdapter.java": "public class PayPalAdapter implements Payment, PaymentStatus {\n    private PayPalService payPalService;\n    private String payPalaccount;\n\n    public PayPalAdapter(String payPalaccount) {\n        this.payPalaccount = payPalaccount;\n        this.payPalService = new PayPalService();\n    }\n    @Override\n    public void pay(double amount) {\n        payPalService.payByPayPal(payPalaccount, amount);\n    }\n    @Override\n    public String getPaymentStatus() {\n        return payPalService.getPaymentStatus();\n    }\n}\n", "WebBlog/WebBlog.java": "import java.util.ArrayList;\nimport java.util.List;\n\npublic class WebBlog implements Media {\n    private List<String> articles = new ArrayList<>();\n    private List<Reader> readers = new ArrayList<>();\n\n    public void publish(String article) {\n        articles.add(article);\n        notification();\n    }\n    @Override\n    public void attach(Reader reader) {\n        readers.add(reader);\n    }\n    @Override\n    public void detach(Reader reader) {\n        readers.remove(reader);\n    }\n    @Override\n    public void notification(){\n        String lastArticle = articles.get(articles.size() - 1);\n        for (Reader reader : readers) {\n            reader.update(lastArticle);\n        }\n    }\n}\n", "WebBlog/Media.java": "public interface Media {\n    void attach(Reader reader);\n    void detach(Reader reader);\n    void notification();\n}\n", "WebBlog/Reader.java": "public interface Reader {\n    void update(String article);\n}\n", "WebBlog/Main.java": "//TIP To <b>Run</b> code, press <shortcut actionId=\"Run\"/> or\n// click the <icon src=\"AllIcons.Actions.Execute\"/> icon in the gutter.\npublic class Main {\n    public static void main(String[] args) {\n        WebBlog myBlog = new WebBlog();\n\n        Reader push = new PushNotification();\n        Reader rss = new RSS();\n\n        myBlog.attach(push);\n        myBlog.attach(rss);\n\n        myBlog.publish(\"Article 1: Java\");\n        myBlog.publish(\"Article 2: Python\");\n        myBlog.publish(\"Article 3: CSS\");\n        myBlog.publish(\"Article 4: IQ\");\n        myBlog.publish(\"Article 5: GPT\");\n    }\n}", "WebBlog/RSS.java": "import java.util.ArrayList;\nimport java.util.List;\n\npublic class RSS implements Reader {\n    private List<String> articles = new ArrayList<>();\n\n\n    @Override\n    public void update(String article) {\n        articles.add(article);\n        if (articles.size() == 5) {\n            System.out.println(\"RSS Feed: \" + articles);\n            articles.clear();\n        }\n    }\n}\n", "WebBlog/text.txt": "Pri implementácii dbajte na dodržiavanie názvov identifikátorov, ako sú uvedené v zadaní a diagrame. Všetky súbory vašej implementácie umiestňujte priamo do pripraveného balíka sk.tuke.kpi.oop.exams.\n\nWebové blogy (WebBlog) umožňujú publikovať (metódou publish()) a udržiavať zoznam všetkých publikovaných článkov a podporujú sledovanie článkov (implementovaním všetkých metód rozhrania Media) čitateľmi. Čitateľ (Reader) je aktualizovaný (metódou upadte()) po publikovaní každého článku. Implementujte dva druhy čitateľov.\n\nPrvý čitateľ (PushNotification) dostane výpis každého článku webového blogu, ktorý je práve publikovaný. Výpis realizujte výpisom článku na štandardný výstup.\n\nDruhý čitateľ (RSS) dostane výpis o skupine posledných piatich publikovaných článkov. U tohto čitateľa použite zoznam, na priebežné udržiavanie aktualne publikovaných článkov. Keď sa zoznam naplní piatimi článkami, vykoná sa výpis a zoznam sa vymaže. Výpis realizujte výpisom pätice článkov na štandardný výstup.\n\nV priloženom Main súbore vytvorte metódu main() (vstupný bod programu), v ktorej použijete vašu implementáciu nasledovne:\n\nV programe (Main) vytvorte objekt webového blogu, ku ktorému pripojte (metódou attach()) obidva druhy čitateľov. Simulujte funkčnosť systému publikovaním rôznych článkov. Prvý čitateľ (PushNotification) musí vypísať článok hneď po jeho publikovaní. Druhý čitateľ (RSS) musí vypísať vždy skupinu piatich článkov až po publikovaní piateho z nich.", "WebBlog/PushNotification.java": "public class PushNotification implements Reader {\n\n    @Override\n    public void update(String article) {\n        System.out.println(\"Push Notification: \" + article);\n    }\n}\n"}}</script>
<script>
const $ = (id) => document.getElementById(id);
let data=null, currentSection=null, currentFolder="__ALL__", currentFile=null, currentText="";

function fmtBytes(n){ if(n===0) return "0 B"; const k=1024,s=["B","KB","MB","GB"]; const i=Math.floor(Math.log(n)/Math.log(k)); return (n/Math.pow(k,i)).toFixed(i===0?0:1)+" "+s[i]; }
function setStatus(m){ $("status").textContent = m||""; }

function renderSections(){
  const bar=$("sectionBar"); bar.innerHTML="";
  data.manifest.sections.forEach(sec=>{
    const b=document.createElement("button");
    b.className="sectionBtn"+(currentSection?.name===sec.name?" active":"");
    b.textContent=sec.name;
    b.onclick=()=>selectSection(sec.name);
    bar.appendChild(b);
  });
}

function selectSection(name){
  currentSection=data.manifest.sections.find(s=>s.name===name)||null;
  currentFolder="__ALL__"; currentFile=null; currentText="";
  $("search").value=""; $("copyBtn").disabled=true;
  $("code").textContent="// Обери файл…"; $("fileTitle").textContent="—"; $("meta").textContent="";
  renderSections(); renderFolders(); renderFiles(); updateCrumbs();
  setStatus("Розділ: "+name);
}

function folderButton(label,key,sub){
  const div=document.createElement("div");
  div.className="item"+(currentFolder===key?" active":""); div.tabIndex=0;
  div.onclick=()=>{ currentFolder=key; currentFile=null; currentText=""; $("copyBtn").disabled=true; $("code").textContent="// Обери файл…"; renderFolders(); renderFiles(); updateCrumbs(); };
  div.onkeydown=(e)=>{ if(e.key==="Enter") div.click(); };
  const left=document.createElement("div"); left.className="left";
  const nm=document.createElement("div"); nm.className="name"; nm.textContent=label;
  const sb=document.createElement("div"); sb.className="sub"; sb.textContent=sub||"";
  left.appendChild(nm); left.appendChild(sb);
  const badge=document.createElement("div"); badge.className="badge"; badge.textContent=(key==="__ALL__"?"ALL":"DIR");
  div.appendChild(left); div.appendChild(badge);
  return div;
}

function renderFolders(){
  const wrap=$("folders"); wrap.innerHTML="";
  if(!currentSection){ wrap.appendChild(folderButton("—","__ALL__","Спочатку обери розділ")); return; }
  const folders=currentSection.folders||[];
  wrap.appendChild(folderButton("Всі файли","__ALL__", folders.length?"Показати все":"—"));
  folders.forEach(f=>wrap.appendChild(folderButton(f,f,"Папка")));
}

function renderFiles(){
  const wrap=$("files"); wrap.innerHTML="";
  if(!currentSection){
    const empty=document.createElement("div"); empty.className="item"; empty.style.cursor="default";
    empty.innerHTML=`<div class="left"><div class="name">Оберіть розділ</div><div class="sub">Кнопки зверху</div></div>`;
    wrap.appendChild(empty); return;
  }
  const q=($("search").value||"").trim().toLowerCase();
  let files=currentSection.files||[];
  if(currentFolder!=="__ALL__") files=files.filter(f=>f.folder===currentFolder);
  if(q) files=files.filter(f=>(f.name||"").toLowerCase().includes(q)||(f.rel||"").toLowerCase().includes(q));
  if(!files.length){
    const empty=document.createElement("div"); empty.className="item"; empty.style.cursor="default";
    empty.innerHTML=`<div class="left"><div class="name">Нічого не знайдено</div><div class="sub">Спробуй інший запит або іншу папку</div></div>`;
    wrap.appendChild(empty); return;
  }
  files.forEach(f=>{
    const div=document.createElement("div");
    div.className="item"+(currentFile?.rel===f.rel?" active":""); div.tabIndex=0;
    div.onclick=()=>selectFile(f.rel);
    div.onkeydown=(e)=>{ if(e.key==="Enter") selectFile(f.rel); };
    const left=document.createElement("div"); left.className="left";
    const nm=document.createElement("div"); nm.className="name"; nm.textContent=f.name;
    const sb=document.createElement("div"); sb.className="sub"; sb.textContent=f.rel;
    left.appendChild(nm); left.appendChild(sb);
    const badge=document.createElement("div"); badge.className="badge"; badge.textContent=f.ext||"file";
    div.appendChild(left); div.appendChild(badge);
    wrap.appendChild(div);
  });
}

function selectFile(rel){
  currentFile=(currentSection.files||[]).find(f=>f.rel===rel)||null;
  const text=data.codeMap[rel] ?? "// (нема даних)";
  currentText=text;
  $("code").textContent=text;
  $("fileTitle").textContent=rel;
  $("meta").textContent=currentFile ? `${fmtBytes(currentFile.size)} • ${currentFile.ext||"file"}` : "";
  $("copyBtn").disabled=!text;
  renderFiles(); updateCrumbs(); setStatus("Готово ✅");
}

function updateCrumbs(){
  if(!currentSection){ $("crumbs").textContent="—"; return; }
  const folderLabel=currentFolder==="__ALL__"?"Всі файли":currentFolder;
  const fileLabel=currentFile?currentFile.name:"—";
  $("crumbs").textContent=`${currentSection.name} → ${folderLabel} → ${fileLabel}`;
}

(function init(){
  data=JSON.parse($("DATA").textContent);
  renderSections(); renderFolders(); renderFiles(); updateCrumbs();
  setStatus("Готово ✅ (обери розділ)");
  $("search").addEventListener("input", ()=>renderFiles());
  $("copyBtn").addEventListener("click", async ()=>{
    if(!currentText) return;
    try{ await navigator.clipboard.writeText(currentText); setStatus("Скопійовано ✅"); }
    catch{
      const ta=document.createElement("textarea"); ta.value=currentText; document.body.appendChild(ta);
      ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
      setStatus("Скопійовано ✅");
    }
  });
})();
</script>
</body>
</html>
